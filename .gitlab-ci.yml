# Publish the web UI as a GitLab Page.
#
# The page is entirely static: the browser does the parsing, planning and conversion, so
# there is no server side and nothing to configure. `web/dist` is built here rather than
# committed, which is why it stays in .gitignore.
stages: [test, deploy]

test:
  stage: test
  image: node:22
  script:
    - npm ci
    - npm run typecheck
    - npm test          # corpus-dependent tests skip cleanly without the private corpus
    - npm run build:web

pages:
  stage: deploy
  image: node:22
  script:
    - npm ci
    - npm run build:web
    - mkdir -p public
    - cp -r web/index.html web/dist public/
  artifacts:
    paths: [public]
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
