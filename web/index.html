<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DNX — expand a Digitone 1 project</title>
<style>
  :root { color-scheme: light dark;
    --bg:#fff; --fg:#16181d; --muted:#6b7280; --line:#e4e6ea; --accent:#6d4aff;
    --card:#f8f9fb; --good:#0a7c3f; --bad:#b3261e; }
  @media (prefers-color-scheme: dark) { :root {
    --bg:#131519; --fg:#e7e9ed; --muted:#98a0ac; --line:#2a2e35; --accent:#b5a2ff;
    --card:#191c21; --good:#4ad07d; --bad:#ff8a80; } }
  * { box-sizing: border-box; }
  body { background:var(--bg); color:var(--fg); margin:0 auto; padding:2rem 1.25rem 4rem; max-width:60rem;
    font:15px/1.55 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
  h1 { font-size:1.5rem; margin:0 0 .2rem; letter-spacing:-.02em; }
  h2 { font-size:.8rem; text-transform:uppercase; letter-spacing:.07em; color:var(--muted);
    margin:2rem 0 .6rem; }
  h3 { font-size:.95rem; margin:1.4rem 0 .5rem; }
  .lede { color:var(--muted); margin:0 0 1.5rem; }
  .cards { display:grid; gap:.75rem; grid-template-columns:repeat(auto-fit, minmax(15rem, 1fr)); }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:.9rem 1rem; }
  .card label { display:block; font-weight:600; margin-bottom:.4rem; }
  input[type=file] { width:100%; font:inherit; font-size:.85rem; }
  .info { margin-top:.5rem; font-size:.85rem; min-height:1.2rem; }
  .muted { color:var(--muted); font-weight:400; }
  .good { color:var(--good); }
  .toggles { display:flex; flex-wrap:wrap; gap:1.25rem; margin:.4rem 0 0; }
  .toggles label { display:flex; gap:.4rem; align-items:flex-start; font-size:.88rem; max-width:17rem; }
  .toggles span { color:var(--muted); font-size:.8rem; display:block; }
  .stats { display:grid; grid-template-columns:repeat(auto-fit, minmax(8rem, 1fr)); gap:.6rem; margin:.5rem 0 1rem; }
  .stats div { background:var(--card); border:1px solid var(--line); border-radius:8px; padding:.6rem .8rem; }
  .stats strong { display:block; font-size:1.4rem; line-height:1.1; }
  .stats span { color:var(--muted); font-size:.78rem; }
  table { border-collapse:collapse; width:100%; font-size:.85rem; }
  th, td { text-align:left; padding:.35rem .5rem; border-bottom:1px solid var(--line); }
  th { color:var(--muted); font-weight:600; font-size:.72rem; text-transform:uppercase; letter-spacing:.05em; }
  td.track { font-weight:700; } td.num { text-align:right; }
  td.from, td.patterns { color:var(--muted); font-size:.8rem; }
  ul.overflow { columns:2; margin:.3rem 0; padding-left:1.1rem; font-size:.85rem; }
  button { font:inherit; font-weight:600; padding:.55rem 1.1rem; border-radius:8px; cursor:pointer;
    border:1px solid var(--accent); background:var(--accent); color:#fff; }
  button:disabled { opacity:.45; cursor:not-allowed; }
  #status { margin-top:1rem; font-size:.85rem; color:var(--muted); }
  #status.error { color:var(--bad); }
</style>
</head>
<body>

<h1>Expand a Digitone 1 project</h1>
<p class="lede">Give every sound-locked sound its own track on the Digitone II's sixteen.
Everything runs in this page — no upload, no server.</p>

<div class="cards">
  <div class="card">
    <label for="sourceFile">Digitone 1 project (.dnprj)</label>
    <input type="file" id="sourceFile" accept=".dnprj">
    <div class="info" id="sourceInfo"></div>
  </div>
  <div class="card">
    <label for="templateFile">Digitone II template (.dn2prj)</label>
    <input type="file" id="templateFile" accept=".dn2prj">
    <div class="info" id="templateInfo">A blank project saved by the device is cleanest.</div>
  </div>
</div>

<h2>Options</h2>
<div class="toggles">
  <label><input type="checkbox" id="compact"> Compact per pattern
    <span>No empty tracks in a pattern, but a sound can move between patterns.</span></label>
  <label><input type="checkbox" id="freeMidi"> Use freed MIDI tracks
    <span>Take tracks 5-8 when the source has no MIDI on them.</span></label>
  <label><input type="checkbox" id="aggregate"> Aggregate by name
    <span class="hint">Sounds sharing a first word (HH CLOSED, HH OPEN) share one track. Where two want the same step, the quieter one stays sound-locked.</span>
  </label>
  <label><input type="checkbox" id="rules"> Percussion low, melodic high
    <span>Place by tag rather than filling in order.</span></label>
</div>

<h2>Plan</h2>
<div id="plan"><p class="muted">Load a project to see what expansion would do.</p></div>

<h2>Export</h2>
<button id="export" disabled>Convert and download .dn2prj</button>
<div id="status"></div>

<script type="module" src="./dist/web/src/app.js"></script>
</body>
</html>
