<!doctype html>

<title>DNX — metrics mockup</title>
<!--
  A mockup, not a page. It links the real stylesheet from ../ so it sits on the real surface, in
  the real tokens, at the real 13px — a mockup that invents its own look would look good and prove
  nothing.

  The data below is SYNTHETIC and generated from a fixed seed. No project is read, no device is
  needed, and none of the user's music is in this file.

  The charts it used to define now live in `web/src/analysis/`, and the manager’s Insights mode
  draws the same ones from real projects. **This page is the harness**: it is the only way to see
  a chart in the state it is hardest to draw — thirty-one voice overruns, 1,344 steps of
  polymeter, six notes in one cell — without a project that produces all of them at once.
-->
<link rel="stylesheet" href="../dnx.css">
<link rel="stylesheet" href="../toolnav.css">
<link rel="stylesheet" href="../viz.css">
<style>
/*
 * Only what is this page's own. **Everything that draws a chart moved to `viz.css`** when the
 * manager became the second surface to draw one — two copies of a chart palette is two palettes
 * waiting to disagree, and the one that drifts is the page nobody opens.
 */
.cards { display: flex; flex-direction: column; gap: .9rem; }
.mockbanner { background: #2a2118; border: 1px solid var(--amber); color: var(--amber);
  border-radius: 4px; padding: .4rem .7rem; font-size: .74rem; margin-bottom: .9rem; }
</style>
</head>
<body class="page wide">

<div class="topbar">
  <span class="brand"><span class="d">DNX</span></span>
  <span id="toolnav">
    <nav class="toolnav" aria-label="Tools">
      <a class="tool" href="../index.html">expander</a>
      <a class="tool" href="../manager.html" aria-current="page">manager</a>
      <a class="tool" href="../library.html">library</a>

  <span class="device">Digitone II</span>

</div>

<main class="viz">
  <div class="mockbanner">
    Mockup — synthetic data, no project loaded. Lands in the manager as a card spanning both
    columns, the way the song card already does.
  </div>
  <div class="cards" id="cards"></div>
</main>

<div id="tip"></div>

<script type="module">
/* =====================================================================================
 * THE MOCKUP IS NOW A HARNESS
 *
 * Every chart and every derivation this page used to hold has moved to `web/src/analysis/`, and
 * this file imports them. What is left is the part that could never be shared: **synthetic data**,
 * and a composition of cards around it.
 *
 * That is the job it keeps. The charts have to degrade toward the busy case — thirty-one voice
 * overruns, 1,344 steps of polymeter, a stack of six notes in one cell — and a real project that
 * happens to produce all of those at once is not something anybody has. This page manufactures
 * them from a fixed seed, with no device and no file, which makes it the only way to see a chart
 * in the state it is hardest to draw.
 *
 * **No project is read and none of the user's music is in this file.**
 * ===================================================================================== */

import { MACHINE } from "../dist/src/project/machine.js";
import { escapeHtml as esc } from "../dist/src/sheet/html.js";
import {
  MACHINE_ORDER, clock, cycleSteps, fitKey, harmonic, holdersAt, machineLabel, microBuckets,
  overlappingNotes, pitchByPreset, pitchWindows, playing, stepsToSeconds, trackWindows,
  voicesPerStep,
} from "../dist/web/src/analysis/model.js";
import {
  densityBars, keyTimeline, legend, machineVar, microDiverging, pcLegend, phaseStrip, pitchBars,
  realignBars, table, trackTimeline, voiceArea, voiceLanes,
} from "../dist/web/src/analysis/charts.js";
import { attachTooltip, mount, repaint } from "../dist/web/src/analysis/mount.js";

/* =====================================================================================
 * SYNTHETIC DATA — generated from a fixed seed so the page is stable between reloads.
 * Trigs are generated first and every metric is derived from them, which is how the real
 * analysis modules work.
 * ===================================================================================== */

const VOICES = 16;            // DN2. The DN1 is 8. A device property, not a file field.
const TEMPO = 138;
const MASTER_LEN = 64;
const DEFAULT_VEL = 100;      // the device's default. Above it reads as an accent.

/** mulberry32 — small, seeded, and good enough for plausible-looking test data. */
function rng(seed) {
  return function () {
    seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

/*
 * Each track gets its **own repeating pitch figure**, not a random draw from one shared scale.
 *
 * The first version had every melodic track pick at random from D natural minor, and the key
 * timeline came out perfectly flat — the fit moved 0 times across 84 bars. That was the data being
 * wrong, not the chart: real tracks play figures, the figures repeat at their own track length, and
 * it is the *phasing* of those figures against each other that makes the harmony move. Give every
 * track the same note pool and there is nothing for polymeter to rearrange.
 */
const SPEC = [
  { t: 1,  len: 16, speed: 1,   machine: MACHINE.fmTone,  preset: "SUB PLUCK",  fill: .95, acc: .25, oct: 3, pool: [2, 5, 9, 5] },
  { t: 2,  len: 12, speed: 1,   machine: MACHINE.fmDrum,  preset: "RIM TOK",    fill: .70, acc: .35, oct: 5, pool: [2] },
  { t: 3,  len: 64, speed: 1,   machine: MACHINE.wavetone, preset: "GLASS LEAD", fill: .48, acc: .18, oct: 5, pool: [9, 0, 2, 4, 5, 7, 0, 9] },
  { t: 4,  len: 24, speed: 1,   machine: MACHINE.swarmer, preset: "WIDE PAD",   fill: .25, acc: .05, oct: 4, pool: [5, 0, 9, 7], chord: [7] },
  { t: 5,  len: 7,  speed: 1,   machine: MACHINE.fmDrum,  preset: "TIN HAT",    fill: 1.0, acc: .40, oct: 6, pool: [6] },
  { t: 6,  len: 64, speed: .5,  machine: MACHINE.fmTone,  preset: "DEEP BASS",  fill: .30, acc: .10, oct: 2, pool: [2, 2, 7, 10] },
  { t: 7,  len: 16, speed: 1,   machine: MACHINE.fmDrum,  preset: "KICK 909",   fill: .88, acc: .30, oct: 2, pool: [2] },
  { t: 8,  len: 16, speed: 2,   machine: MACHINE.wavetone, preset: "NOISE HAT",  fill: .38, acc: .12, oct: 6, pool: [11] },
  { t: 9,  len: 48, speed: 1,   machine: MACHINE.fmTone,  preset: "STAB CHORD", fill: .14, acc: .50, oct: 4, pool: [5, 9, 0, 4], chord: [3, 7, 10] },
  { t: 10, len: 64, speed: 1,   machine: MACHINE.midi,    preset: "EXT SYNTH",  fill: .17, acc: .15, oct: 4, pool: [7, 10, 2, 10] },
];

/** The presets a sound lock puts on a trig, standing in for a pool this page does not have. */
const LOCK_PRESETS = ["CLAP TAIL", "SNAP", "SHKR", "CONGA HI"];

/** Build the trigs. Every metric below is derived from these, never invented separately. */
const random = rng(20260816);
const tracks = SPEC.map((s) => {
  const trigs = [];
  for (let step = 0; step < s.len; step++) {
    if (random() > s.fill) continue;
    const accented = random() < s.acc;
    const percussive = s.machine === MACHINE.fmDrum;
    // The figure advances with the step, so it repeats with the track and phases against the rest.
    const pc = s.pool[step % s.pool.length];
    /*
     * **Every note on the trig, not just the first.**
     *
     * A note p-lock is not in the lock table at all — `plockparams.ts` lists `TRIG 1 NOTE` under
     * NOT_LOCKABLE because the trig slot itself carries `track | step | note | velocity |
     * noteLength | microTiming`. So the note we already read *is* the locked note.
     *
     * What was genuinely being dropped is **chords**: a trig decodes a `notes` array and this page
     * counted one pitch per trig. A four-note stab is four pitches and four voices, so every pitch
     * count and the whole voice budget were under-reported.
     */
    const root = s.oct * 12 + pc;
    const voicing = s.chord && random() < 0.6 ? s.chord : [];
    /*
     * **The order these `random()` calls run in is load-bearing.** It is one seeded sequence, so
     * moving a draw past another changes every value after it and the page becomes a different
     * pattern. Extracting the charts out of this file did exactly that once: the sound-lock draw
     * was hoisted above the velocity draw, every trig shifted, and eight charts diffed as wrong
     * when what had actually moved was the data underneath them.
     */
    trigs.push({
      step,
      // Real note numbers, not pitch classes: a stack has to be ordered low to high, and a pitch
      // class cannot say which of two notes is the lower one.
      notes: [root, ...voicing.map((iv) => root + iv)],
      velocity: accented ? 108 + Math.floor(random() * 20) : 62 + Math.floor(random() * 38),
      // Gate length. Drums are short; melodic notes sustain, but not for most of a bar — the first
      // pass allowed up to 10 steps across ten tracks and produced a pattern holding 27 voices at
      // once, which is not music, it is a stress test. Tuned so the pattern peaks just over the
      // 16-voice budget: a mockup that never trips the alert cannot show the alert.
      length: 1 + Math.floor(random() * (percussive ? 2 : s.preset === "WIDE PAD" ? 7 : 5)),
      microTiming: random() < 0.12 ? Math.round((random() * 2 - 1) * 23) : 0,
      // A trig that names its own preset instead of the track's. Drawn last, as it always was.
      lockPreset: random() < (s.machine === MACHINE.fmDrum ? 0.22 : 0.04)
        ? LOCK_PRESETS[step % LOCK_PRESETS.length] : undefined,
    });
  }
  return { number: s.t, length: s.len, speed: s.speed, machine: s.machine, preset: s.preset, trigs };
});

/** The one thing every function under `analysis/` takes. A real page builds this from a project. */
const subject = {
  label: "Synthetic pattern",
  tempo: TEMPO,
  masterLength: MASTER_LEN,
  voiceBudget: VOICES,
  defaultVelocity: DEFAULT_VEL,
  tracks,
};
const live = playing(subject);

const card = (title, body) =>
  `<section class="panel"><h2>${esc(title)}</h2><div class="body">${body}</div></section>`;

/* =====================================================================================
 * Compose
 * ===================================================================================== */

const cycle = cycleSteps(live);
const cycleSec = stepsToSeconds(cycle, TEMPO);
const voices = voicesPerStep(live, MASTER_LEN);
const peak = Math.max(...voices);
const over = voices.filter((v) => v > VOICES).length;
const pitch = pitchByPreset(live);
const micro = microBuckets(live);
const allTrigs = live.reduce((a, t) => a + t.trigs.length, 0);
const accents = live.reduce((a, t) =>
  a + t.trigs.filter((g) => g.velocity > DEFAULT_VEL).length, 0);
const locks = live.reduce((a, t) =>
  a + t.trigs.filter((g) => g.lockPreset !== undefined).length, 0);
const sorted = [...voices].sort((a, b) => a - b);
const peakStep = voices.indexOf(peak);
const holders = holdersAt(live, MASTER_LEN, peakStep);
const byTrack = [...holders.reduce((m, x) => {
  const e = m.get(x.track) ?? { track: x.track, n: 0, notes: [] };
  e.n++; e.notes.push(x.note); m.set(x.track, e); return m;
}, new Map()).values()].sort((a, b) => b.n - a.n);

// One window per bar across the whole cycle — the span over which the harmony actually moves.
const tonal = harmonic(live);
const keyWindows = pitchWindows(tonal, cycle, 16, 16);
const whole = fitKey(keyWindows.reduce((acc, v) => acc.map((x, i) => x + v.counts[i]),
  new Array(12).fill(0)));
const changes = keyWindows.filter((v, i) => i && v.fit.name !== keyWindows[i - 1].fit.name).length;
const overlaps = live.map((t) => ({ track: t, pairs: overlappingNotes(t) }));
const pairCount = overlaps.reduce((a, x) => a + x.pairs.length, 0);
const pairTracks = overlaps.filter((x) => x.pairs.length);

document.getElementById("cards").innerHTML =
  card("Play time and cycle", `
    <div class="tiles">
      <div class="tile"><span class="k">Tempo</span><span class="v">${TEMPO}</span>
        <span class="u">BPM</span></div>
      <div class="tile"><span class="k">Master length</span><span class="v">${MASTER_LEN}</span>
        <span class="u">steps</span>
        <span class="note">${clock(stepsToSeconds(MASTER_LEN, TEMPO))} · 4 bars</span></div>
      <div class="tile"><span class="k">True cycle</span>
        <span class="v">${cycle.toLocaleString()}</span><span class="u">steps</span>
        <span class="note">${clock(cycleSec)} · ${cycle / 16} bars</span></div>
      <div class="tile"><span class="k">Tracks in play</span><span class="v">${live.length}</span>
        <span class="u">of 16</span>
        <span class="note">${new Set(live.map((t) => t.length)).size} distinct lengths</span></div>
    </div>

    <div class="ctrl" style="margin-top:.9rem">
      <label for="mode">Dots show</label>
      <select id="mode">
        <option value="velocity">Velocity — accents ringed</option>
        <option value="length">Note length</option>
        <option value="locks">Preset locks</option>
        <option value="overlap">Overlapping notes — glide candidates</option>
      </select>
    </div>
    <figure>
      <figcaption>Each tick is a track restarting and each dot is a trig, so the polymeter is read
        against the actual rhythm. <b>${accents} of ${allTrigs} trigs are above the default
        velocity of ${DEFAULT_VEL}</b> and are drawn brighter and ringed.</figcaption>
      <div class="chart" id="c-phase"></div>
    </figure>
    ${legend(MACHINE_ORDER.map((m) => [machineLabel(m), machineVar(m)]))}
    <div class="inferred" id="glidenote" hidden>
      <span class="h">Overlaps are not yet glides</span>
      <p class="why"><b>${pairCount} overlapping pair${pairCount === 1 ? "" : "s"}</b> on
        ${pairTracks.length} track${pairTracks.length === 1 ? "" : "s"}
        (${pairTracks.map((x) => `T${x.track.number}`).join(", ")}) — a note still sounding when the
        next one starts. That is the geometry of a glide, and it is all we can read: a glide is an
        overlap on a <b>monophonic</b> track with <b>portamento</b> on. Per-trig portamento is
        readable — <code>PORT</code> is lock id 99 and <code>PTIM</code> is 100 — but the
        track-level default and mono/poly both live in the preset's SETUP page, which no capture has
        covered. Calling these glides would assert two values we cannot see, so they are counted as
        overlaps and added to the capture list instead.</p>
    </div>

    <figure style="margin-top:1rem">
      <figcaption>Nothing realigns until every track has wrapped together —
        <b>${cycle.toLocaleString()} steps, ${clock(cycleSec)}</b>, against a master length that
        reads as 4 bars. <b>T5's length of 7</b> is what stretches it.</figcaption>
      <div class="chart" id="c-realign"></div>
    </figure>
    ${table(["Track", "Preset", "Length", "Speed", "Machine", "Trigs", "Repeats per cycle"],
      live.map((t) => [`T${t.number}`, t.preset, t.length, `${t.speed}x`, machineLabel(t.machine),
        t.trigs.length, cycle / t.length]))}
  `) +

  card("Voice pressure", `
    <div class="tiles">
      <div class="tile ${peak > VOICES ? "flag" : ""}"><span class="k">Peak voices</span>
        <span class="v">${peak}</span><span class="u">of ${VOICES}</span>
        <span class="note">${peak > VOICES ? `${peak - VOICES} over budget` : "within budget"}</span></div>
      <div class="tile ${over ? "flag" : ""}"><span class="k">Steps over</span>
        <span class="v">${over}</span><span class="u">of ${MASTER_LEN}</span></div>
      <div class="tile"><span class="k">Median</span>
        <span class="v">${sorted[Math.floor(sorted.length / 2)]}</span><span class="u">voices</span></div>
      <div class="tile"><span class="k">May extend</span><span class="v">4</span>
        <span class="u">trigs</span><span class="note">long AMP REL</span></div>
    </div>
    <figure style="margin-top:.9rem">
      <figcaption>Voices held by a gate at each step, against the Digitone II's
        <b>${VOICES}</b>.</figcaption>
      <div class="chart" id="c-voice"></div>
    </figure>

    <figure style="margin-top:.7rem">
      <figcaption>And <b>whose</b> they are. Same axis, so the shaded columns line up: a solid bar
        inside one is a note sounding while the budget is exceeded, and therefore a candidate to
        remove.</figcaption>
      <div class="chart" id="c-lanes"></div>
    </figure>

    <div class="inferred">
      <span class="h">At the peak — step ${peakStep + 1}, ${peak} voices${
        peak > VOICES ? `, ${peak - VOICES} over` : ""}</span>
      <p class="why">Grouped by track and ranked, because the question is <b>which track to
        thin</b> and ${holders.length} separate notes do not answer it. ${peak > VOICES
        ? `<b>T${byTrack[0].track.number} ${esc(byTrack[0].track.preset)}</b> is holding
           ${byTrack[0].n} of them here, and only ${peak - VOICES}
           ${peak - VOICES === 1 ? "has" : "have"} to go — so thinning that one track covers it.`
        : `Nothing needs removing — the peak sits exactly on the budget, with no headroom for
           another track.`}</p>
      <p class="why" style="margin-top:.35rem">${byTrack.map((x) =>
        `<b style="color:var(${machineVar(x.track.machine)})">&#9679;</b> T${x.track.number}
         ${esc(x.track.preset)} <b>&#215;${x.n}</b>
         <span style="color:var(--ink3)">${x.notes.join(" ")}</span>`).join(" &nbsp;&nbsp; ")}</p>
    </div>

    <div class="inferred">
      <span class="h">Exact, and not exact</span>
      <p class="why">The count is <b>gate time</b>, which is exact — it comes from each trig's note
        length. What a voice actually holds is longer, because the AMP envelope's release continues
        after the gate; <code>AMP REL</code> is decoded but its 0–127 to seconds curve is not, so
        those trigs are flagged as <b>may extend</b> rather than given an invented duration.</p>
    </div>
  `) +

  card("What is on each track", `
    <div class="tiles">
      <div class="tile"><span class="k">Trigs</span><span class="v">${allTrigs}</span></div>
      <div class="tile"><span class="k">Accented</span><span class="v">${accents}</span>
        <span class="u">trigs</span>
        <span class="note">above velocity ${DEFAULT_VEL}</span></div>
      <div class="tile"><span class="k">Preset locks</span><span class="v">${locks}</span></div>
      <div class="tile"><span class="k">Microtimed</span>
        <span class="v">${allTrigs - micro.onGrid}</span><span class="u">trigs</span></div>
    </div>
    <figure style="margin-top:.9rem">
      <figcaption>Tracks are identified by <b>lane and label</b>, never by colour — sixteen is twice
        what a categorical palette can carry.</figcaption>
      <div class="chart" id="c-density"></div>
    </figure>
    ${legend([["Trigs", "--s3"], ["Parameter locks", "--s4"], ["Preset locks", "--s7"]])}
    <figure style="margin-top:1rem">
      <figcaption>Microtiming, for the <b>${allTrigs - micro.onGrid} trigs off the grid</b> — the
        other ${micro.onGrid} sit on it and are left out of the plot rather than flattening
        it.</figcaption>
      <div class="chart" id="c-micro"></div>
    </figure>
  `) +

  card("Pitch content", `
    <figure>
      <figcaption>Every note in the pattern by pitch class, stacked by the machine that plays it.
        <b>Hover a column to see which presets sound that note.</b> This is a fact.</figcaption>
      <div class="chart" id="c-pitch"></div>
    </figure>
    ${legend(MACHINE_ORDER.map((m) => [machineLabel(m), machineVar(m)]))}

    <div class="ctrl" style="margin-top:1.1rem">
      <label for="keymode">Timeline</label>
      <select id="keymode">
        <option value="pitch">By pitch class &mdash; what is sounding</option>
        <option value="track">By track &mdash; who is playing it</option>
      </select>
      <span id="spanctrl" hidden>
        <label for="keyspan" style="margin-left:.4rem">Span</label>
        <select id="keyspan">
          <option value="beat">4 bars — a column per beat</option>
          <option value="bar">Full cycle — a column per bar</option>
        </select>
      </span>
    </div>
    <figure>
      <figcaption id="keycap"></figcaption>
      <div class="chart" id="c-keytime"></div>
    </figure>
    <div id="keylegend">${legend([["Minor fit", "--s7"], ["Major fit", "--s4"],
      ["More notes", "--q6"], ["Fewer notes", "--q2"]])}</div>

    <div class="inferred">
      <span class="h">Best fit over the whole cycle — an inference, not a reading</span>
      <p class="fit">${whole.name} <span style="color:var(--ink2);font-size:.8rem">— margin
        ${whole.margin.toFixed(2)} over ${whole.runnerUp}</span></p>
      <p class="why">Krumhansl–Schmuckler correlation against the standard profiles, named so the
        method is attributable. <b>The margin is the confidence, not the correlation</b> — a
        relative minor shares six of seven notes with its major, so a high score with a small
        margin is the normal case rather than the exception. The device stores no key. Three things
        can move a pitch and none is visible here: the <b>arpeggiator</b> transposes and its
        settings are not yet decoded, a <b>note p-lock</b> changes pitch on one trig, and percussive
        FM material has no tonality to find.</p>
    </div>
    ${table(["Pitch class", "Notes", "Presets"], pitch.filter((c) => c.total).map((c) =>
      [c.name, c.total, Object.entries(c.byPreset).sort((a, b) => b[1] - a[1])
        .map(([p, n]) => `${p} x${n}`).join(", ")]))}
  `);

/*
 * Read from the control, never assumed.
 *
 * A browser restores a `<select>`'s value across a reload without firing `change`, so a hard-coded
 * `let mode = "velocity"` disagreed with the control the moment the page was refreshed in any other
 * mode — the dropdown said one thing and the state variable another. The control is the source of
 * truth; the variable is a cache of it.
 */
const modeEl = document.getElementById("mode");
let mode = modeEl.value;
document.getElementById("glidenote").hidden = mode !== "overlap";
mount(document.getElementById("c-phase"), (w) => phaseStrip(live, MASTER_LEN, mode, DEFAULT_VEL, w));
mount(document.getElementById("c-realign"), (w) => realignBars(live, cycle, w));
mount(document.getElementById("c-voice"), (w) => voiceArea(voices, VOICES, w));
mount(document.getElementById("c-lanes"), (w) => voiceLanes(live, MASTER_LEN, voices, VOICES, w));
const keymodeEl = document.getElementById("keymode");
const keyspanEl = document.getElementById("keyspan");
let keymode = keymodeEl.value;
let keyspan = keyspanEl.value;

/*
 * **The track view defaults to four bars at beat resolution, and that is a correction.**
 *
 * It first drew the same 84 bars as the pitch view, and at seventeen pixels a column the stacks
 * became a texture: every bar looked alike, and a chart you cannot read one column of is not
 * showing you music. This view's unit of meaning is a chord, not a trend, so it wants few wide
 * columns.
 *
 * The full cycle is still offered, because "where does this track change" is a real question. It
 * is just a different one from "what is it playing here".
 */
const masterFit = fitKey(pitchWindows(tonal, MASTER_LEN, MASTER_LEN, MASTER_LEN)[0].counts);
const trackRowsBeat = trackWindows(tonal, MASTER_LEN, 4, 4, () => masterFit);
const trackRowsBar = trackWindows(tonal, cycle, 16, 16, (i) => keyWindows[i]?.fit);
const KEY_LEGEND = {
  pitch: legend([["Minor fit", "--s7"], ["Major fit", "--s4"], ["More notes", "--q6"],
                 ["Fewer notes", "--q2"]]),
  track: pcLegend(),
};
const drawKey = (w) => keymode === "track"
  ? trackTimeline(keyspan === "beat" ? trackRowsBeat : trackRowsBar,
                  keyspan === "beat" ? 4 : 16, w)
  : keyTimeline(keyWindows, w);

const CAPTION = {
  pitch: `A key belongs to a <b>moment</b>, not to a pattern. With per-track scale on the tracks
    phase against one another, so what sounds together genuinely changes bar by bar without
    anything being edited — across the full ${cycle / 16}-bar cycle the fit moves
    <b>${changes} times</b>. Above, the pitch classes actually sounding in each bar; below, the
    best fit, <b>faded where it cannot really tell</b>.`,
  "track-beat": `Every note each track has sounding, stacked low to high. Spacing is even rather
    than tonal — a triad is three lines whatever the voicing — so six tracks fit in the
    height a piano roll spends on one. <b>Hover a stack for a possible chord name.</b>`,
  "track-bar": `The same stacks across the whole ${cycle / 16}-bar cycle, a column per bar, with
    the chord read against the key fitted around it. Good for finding <b>where a track
    changes</b>; too dense to read a single chord from — switch the span back to four bars
    for that.`,
};
const capFor = () => keymode === "track" ? CAPTION[`track-${keyspan}`] : CAPTION.pitch;

function repaintKey() {
  repaint(document.getElementById("c-keytime"), drawKey);
  document.getElementById("keylegend").innerHTML = KEY_LEGEND[keymode];
  document.getElementById("keycap").innerHTML = capFor();
  document.getElementById("spanctrl").hidden = keymode !== "track";
}

mount(document.getElementById("c-keytime"), drawKey);
document.getElementById("keylegend").innerHTML = KEY_LEGEND[keymode];
document.getElementById("keycap").innerHTML = capFor();
document.getElementById("spanctrl").hidden = keymode !== "track";
keymodeEl.addEventListener("change", (e) => { keymode = e.target.value; repaintKey(); });
keyspanEl.addEventListener("change", (e) => { keyspan = e.target.value; repaintKey(); });
mount(document.getElementById("c-density"), (w) => densityBars(live, DEFAULT_VEL, w));
mount(document.getElementById("c-micro"), (w) => microDiverging(micro.buckets, w));
mount(document.getElementById("c-pitch"), (w) => pitchBars(pitch, w));

modeEl.addEventListener("change", (e) => {
  mode = e.target.value;
  repaint(document.getElementById("c-phase"),
          (w) => phaseStrip(live, MASTER_LEN, mode, DEFAULT_VEL, w));
  // The caveat belongs with the mode that raises it, not permanently on the page.
  document.getElementById("glidenote").hidden = mode !== "overlap";
});

attachTooltip(document.getElementById("tip"));
</script>
</body>
</html>
