<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DNX — device probe</title>
<link rel="stylesheet" href="./dnx.css">
<link rel="stylesheet" href="./toolnav.css">
<!-- Classic, not a module: it has to still be standing when the module is not. -->
<script src="./boot.js"></script>
<!-- The arriving page starts offset; this must run before the first paint. See arrival.js. -->
<script src="./arrival.js"></script>
<style>

h1 { font-size: .82rem; margin: 0 .6rem 0 0; text-transform: uppercase; letter-spacing: .12em;
  color: var(--teal); font-weight: 600; }
/* Quiet, but readable without hunting: it is checked once per session and ignored the rest. */
.build { color: var(--dim); font-weight: 400; letter-spacing: .04em; font-size: .7rem; }
label.lbl { font-size: .7rem; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; }
input[type=text], input[type=number] {
  background: #1b2123; color: var(--fg); border: 1px solid var(--line-soft);
  border-radius: 3px; padding: .25rem .4rem; font: inherit; font-size: .8rem; width: 4.5rem;
}
/* The only control on this page that changes the instrument. It should not look like the others. */
.btn.danger { border-color: var(--salmon); color: var(--salmon); }

main { flex: 1; overflow: auto; padding: .9rem; display: flex; flex-direction: column; gap: .7rem; }

.card {
  background: var(--panel); border: 1px solid var(--line); border-radius: 4px;
  padding: .7rem .9rem;
}
.card h2 {
  margin: 0 0 .5rem; font-size: .7rem; text-transform: uppercase; letter-spacing: .1em;
  color: var(--teal); font-weight: 600;
}
/*
 * The control cards.
 *
 * A grid so the three sit side by side where there is room and stack where there is not: the probe
 * is used on a laptop beside an instrument as often as on a desk, and three columns of controls on
 * a narrow window would be worse than the bar they replaced.
 */
/*
 * **Outside `main`, so it does not scroll away.** A probe is used by pressing something and then
 * reading a long result; controls that scroll out of reach as the output grows would mean scrolling
 * back up to press the next one. `main` keeps `overflow: auto` and this band stays put.
 */
.controls {
  display: grid; grid-template-columns: repeat(auto-fit, minmax(22rem, 1fr));
  /* `start`, or the grid stretches every card to the tallest and the two short ones carry ~230px
     of dead space each. Seen in a browser; the rule reads fine without it. */
  gap: .7rem; padding: .7rem .9rem 0; align-items: start;
}
.controls .card { padding: .6rem .7rem; }
.crow { display: flex; align-items: center; flex-wrap: wrap; gap: .4rem; padding: .3rem 0; }
/*
 * **A path has to be readable, so `size` wins here.** The blanket `input[type=text] { width: 4.5rem }`
 * above clipped `/soundbanks/H/256` to `/soundbar` and `/projects/1` to `/projects/'` — 72px, with
 * the value scrolled out of sight. It was doing that in the old bar too; moving these controls into
 * a card is what made it visible.
 */
.crow input[type=text] { width: auto; min-width: 4.5rem; }
.crow + .crow { border-top: 1px solid var(--line-soft); }
/* The group name, wider than the inline field labels so the rows line up down the card. */
.crow > .lbl:first-child { min-width: 6.5rem; color: var(--teal); }
/* Named for what it does, not for how it looks: everything in here changes the instrument. */
.danger-card { border-color: var(--salmon); }
.danger-card h2 { color: var(--salmon); }
.row { display: flex; gap: .8rem; padding: .18rem 0; border-bottom: 1px solid var(--line-soft); }
.row:last-child { border-bottom: none; }
.row .k { color: var(--muted); min-width: 12rem; font-size: .78rem; }
.row .v { font-family: ui-monospace, Consolas, monospace; font-size: .8rem; word-break: break-all; }
.num { text-align: right; }
.mono { font-family: ui-monospace, Consolas, monospace; }
/* Safety, said in colour as well as in words — the table is scanned, not read. */
.read { color: var(--teal); }
.write { color: var(--salmon); font-weight: 600; }
.unknown { color: var(--amber); }

/*
 * `.note` is gone. It held one 1,109-character paragraph explaining this page, between the
 * controls and the results, and it cost 30% of the results window at 1600x876 and all of it at
 * 900x800. The text now lives on a `?` on each card — `dnx.css`, `web/src/help.ts`.
 */
</style>
</head>
<body class="app">

<div class="topbar">
  <!-- The tool row is built by `toolnav.ts`, so no page can say something different. -->
  <span class="brand"><span class="d">DNX</span></span>
  <span id="toolnav"></span>
  <span class="spacer"></span>
  <!--
    The build time sits beside the title, not only in the tab. The tab is where nobody looks, and
    the entire point of the stamp is answering "am I running the fix?" at a glance.
  -->
  <h1>Device probe <span class="build" id="buildStamp" title="When the code running this page was compiled">build &mdash;</span></h1>
</div>

<!--
  **The controls used to live in the bar above.** About thirty of them, wrapping over three lines,
  which made this page's chrome a different height from every other tool's and buried the one
  dangerous button among twenty harmless ones.

  Grouped by *when you use them* rather than by what they send. Ports and session are the things you
  touch every time; requests are what you came for; the +Drive is its own card because every control
  in it changes the instrument, and one of them froze a Digitone 1 three times.

  Three columns where there is room, stacking where there is not — the probe is used on a laptop
  beside an instrument as often as on a desk.
-->
<div class="controls">
  <section class="card">
    <h2 data-help="session">Ports and session</h2>
    <div class="crow">
      <span class="lbl">Ports</span>
      <label class="lbl" for="output">Out</label>
      <select id="output"></select>
      <label class="lbl" for="input">In</label>
      <select id="input"></select>
      <button class="btn" id="rescan">Rescan</button>
    </div>
    <div class="crow">
      <span class="lbl">Session</span>
      <button class="btn primary" id="probe" disabled>Probe</button>
      <button class="btn" id="listen" disabled>Listen</button>
      <button class="btn" id="save" disabled>Save capture</button>
    </div>
  </section>

  <section class="card">
    <h2 data-help="requests">Requests</h2>
    <div class="crow">
      <span class="lbl">Dump</span>
      <select id="reqWhat" disabled></select>
      <label class="lbl" for="reqObj">obj</label>
      <input id="reqObj" type="number" min="0" max="127" value="0" disabled>
      <button class="btn" id="request" disabled>Request</button>
      <button class="btn" id="readProject" disabled>Read project</button>
    </div>
    <!--
      One unidentified request per press, deliberately. There is no sweep-all: `device-probing.md`
      rule 4 is one message per run on something expendable, and the whole value of this control is
      knowing which code produced what.

      `Try code` builds `0x6n` *dump* requests only, so the API's own information codes were
      unreachable &mdash; `0x03` above all, the one Elektron Transfer polls continuously and nobody has
      explained. We nearly built a content-fingerprinting workaround while it sat unsent.

      `Query` (`0x09`) is not here: the Probe button already sweeps it, with better-researched keys.

      Read-only by construction: both lists are fixed. The API's other nibbles write, delete and
      open handles, and one of those froze a Digitone 1 three times.
    -->
    <div class="crow">
      <span class="lbl">Unidentified</span>
      <select id="probeCode" disabled title="An unidentified request code"></select>
      <label class="lbl" for="probeObj">obj</label>
      <input id="probeObj" type="number" min="0" max="127" value="0" size="3" disabled>
      <button class="btn" id="probeSend" disabled>Try code</button>
      <select id="askCode" disabled title="An API information code"></select>
      <button class="btn" id="askSend" disabled>Ask</button>
    </div>
  </section>

  <!--
    Its own card because everything in it changes the instrument. Grouping by usage put the four
    controls that can destroy work in one place, which is worth more than the tidiness: in the bar
    they sat between a port selector and a listing path.
  -->
  <section class="card danger-card">
    <h2 data-help="writing">Writing &mdash; changes the instrument</h2>
    <div class="crow">
      <span class="lbl">Patterns</span>
      <button class="btn danger" id="writeBack" disabled title="Send a captured record back to the slot it came from">Write back</button>
      <select id="writeFrom" disabled title="Which captured pattern to send"></select>
      <label class="lbl" for="writeTo">to</label>
      <input id="writeTo" type="text" value="H16" size="4" disabled title="Destination slot, e.g. H16">
      <button class="btn danger" id="writeSlot" disabled title="Copy a captured pattern into another slot on the device">Write to slot</button>
    </div>
    <!--
      Read-only, and the friendliest failure on the device: a wrong path is answered `Invalid path`
      in as many words, so guessing costs a round trip.
    -->
    <div class="crow">
      <span class="lbl">+Drive list</span>
      <label class="lbl" for="lsPath">path</label>
      <input id="lsPath" type="text" value="/" size="12" disabled>
      <label class="lbl" for="lsFrom">from</label>
      <input id="lsFrom" type="number" min="0" value="0" size="3" disabled title="Page cursor. 0 asks for the whole listing.">
      <label class="lbl" for="lsCount">count</label>
      <input id="lsCount" type="number" min="0" value="0" size="3" disabled title="0 asks for the whole listing. A start without a count asks for nothing.">
      <button class="btn" id="lsSend" disabled>List</button>
    </div>
    <!--
      `0x54` froze a Digitone 1 three times, and every one of those bodies was a raw integer with no
      NUL terminator. The only body it has ever answered is a NUL-terminated path, which is what this
      now sends &mdash; the third hypothesis about this message, and still a hypothesis.

      The last segment is the **index**, not the name: `/projects/1`, not `/projects/PRESETS`. That
      is what `invalid project id` had been saying all along.
    -->
    <div class="crow">
      <span class="lbl">+Drive read</span>
      <label class="lbl" for="filePath">file</label>
      <input id="filePath" type="text" value="/projects/1" size="20" disabled title="The index from a /projects listing, not the project name: /projects/1">
      <button class="btn danger" id="fileRead" disabled title="Open, read and close a file on the +Drive. This froze a Digitone 1 three times.">Read file</button>
    </div>
    <!--
      The first write to a Digitone's +Drive. It reads `file` and writes those exact bytes to `to`,
      using the checksum the device itself reported on the read.

      **Empty slots only, refused not warned.** The listing says which slots are empty; there are 73
      on this instrument, so there is no reason for a write to be able to overwrite anything.
    -->
    <div class="crow">
      <span class="lbl">+Drive write</span>
      <label class="lbl" for="writeTarget">to</label>
      <input id="writeTarget" type="text" value="/soundbanks/H/256" size="18" disabled title="Destination &mdash; must be an empty slot">
      <label class="lbl" for="corruptSum">corrupt</label>
      <input id="corruptSum" type="checkbox" disabled title="Flip a bit in the checksum, to find out whether it is enforced">
      <!--
        The chunk size is a control because **the chunk count is the open question**, and this is
        the only way to vary it without also varying the payload. Every write ever sent or captured
        was a single chunk, so nothing is known about what a second one should carry — whether the
        whole-file checksum is repeated, or each chunk carries its own. Writing a known 364-byte
        preset at 128 asks that with one variable changed and the bytes held still; reaching for a
        bigger file instead would change both at once and leave a refusal ambiguous.
      -->
      <label class="lbl" for="chunkSize">chunk</label>
      <!--
        The ceiling is above any object we write, so the **one-chunk control** stays available: the
        same bytes to the same kind of slot in a single 0x58. A refusal is only evidence about
        chunking if the one-chunk form of it succeeds.
      -->
      <input id="chunkSize" type="number" value="2048" min="16" max="65536" step="16" disabled title="Bytes per 0x58 write. Below the file size forces a multi-chunk write; above it forces one.">
      <button class="btn danger" id="fileWrite" disabled title="Read `file` and write it to `to`. The first +Drive write.">Read &rarr; write</button>
    </div>
  </section>
</div>

<main>
  <!--
    The write verdict lives outside #results on purpose. #results is cleared and redrawn on every
    incoming MIDI message, so anything put there is destroyed by the next thing the device says —
    which is exactly what happened to two generations of this card. A separate element cannot be
    wiped by a renderer that does not know it exists.
  -->
  <div id="writeResult"></div>
  <div id="results"></div>
</main>

<div class="status" id="status">Requesting MIDI access&hellip;</div>

<!--
  What this page is, said where it costs the layout nothing.

  This was one paragraph in a `.note` between the controls and the results. It is the same
  sentences, split along the cards they describe and reachable from the `?` on each &mdash;
  `web/src/help.ts` has the measurements that moved it.

  **The split found two claims that had quietly stopped being true.** "Read-only" was the first
  word on a page whose third card writes to the instrument; it is true of *Ports and session*,
  which is where it now sits. And "Write back is the one exception and the only control here that
  changes your instrument" was written before the +Drive controls existed &mdash; there are four
  of them now, and one of them froze a Digitone 1 three times. Text kept beside what it describes
  is text somebody notices is wrong.

  Inert until cloned: a `<template>` renders nothing and its contents are not part of the document.
-->
<template id="help">
  <section data-topic="session">
    <h3>Ports and session</h3>
    <p>
      Read-only. <strong>Probe</strong> asks the device what it is, what firmware it runs, which
      messages it supports, and what is on its +Drive. <strong>Listen</strong> sends nothing at
      all &mdash; it captures whatever the device chooses to send, so you can trigger a dump from
      the front panel (<span class="mono">SETTINGS &gt; SYSEX DUMP &gt; SYSEX SEND</span>) and
      save the result as a <span class="mono">.syx</span>.
    </p>
    <p>
      Needs Chrome or Edge &mdash; Safari and Firefox have no WebMIDI &mdash; and will ask for
      SysEx permission, which is the whole point: without it every request is silently dropped
      and the device looks like it is not answering.
    </p>
  </section>

  <section data-topic="requests">
    <h3>Requests</h3>
    <p>
      <strong>Read project</strong> asks for all 128 patterns, all 128 sound-pool slots and the
      project settings, one at a time, waiting for each answer before asking again &mdash; the
      same capture as <strong>Listen</strong>, without touching the device's menus.
    </p>
    <p>
      Requests carry an empty body, so none of that writes anything to the device. The same is
      true of <strong>Try code</strong> and <strong>Ask</strong>: both lists are fixed, and
      neither can build a request that writes.
    </p>
  </section>

  <section data-topic="writing">
    <h3>Writing &mdash; changes the instrument</h3>
    <p>
      These controls change your instrument, which is why they have a card of their own. Load a
      scratch project first, and read <span class="mono">docs/device-probing.md</span>.
    </p>
    <p>
      <strong>Write back</strong> sends a record from the current capture back to the slot it came
      from &mdash; identical bytes to the same place &mdash; then reads it again and compares.
      <strong>Read file</strong> opens, reads and closes a file on the +Drive, and froze a Digitone
      1 three times. <strong>Read &rarr; write</strong> copies those same bytes to an empty slot,
      and an empty slot is the only destination it will accept.
    </p>
    <p>
      <strong>List</strong> is the exception in here: it only asks what is on the +Drive, and a
      wrong path is answered <span class="mono">Invalid path</span> in as many words.
    </p>
  </section>
</template>

<script type="module" src="dist/web/src/probe/main.js"></script>
</body>
</html>
